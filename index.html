<script id="app-files" type="application/json">{"app.py": "\"\"\"Streamlit web UI for the Campus Delivery Robot.\n\n    streamlit run app.py\n\"\"\"\n\nfrom __future__ import annotations\n\nimport dataclasses\nimport re\n\nimport altair as alt\nimport pandas as pd\nimport streamlit as st\n\nfrom robot import (ALGORITHMS, MAPS, POLICIES, Costs, Encounter, ObstacleDynamics,\n                   SensorModel, SimConfig, bayes_update, evaluate, load_map,\n                   move_threshold, predict, run_episode)\nfrom robot.mdp import MOVE, REROUTE, WAIT, action_values, solve\n\nst.set_page_config(page_title=\"Campus Delivery Robot\", page_icon=\"🤖\", layout=\"wide\")\n\n# ---------------------------------------------------------------------------\n# Colours (explicit, so the map reads well in both light and dark themes)\n# ---------------------------------------------------------------------------\n\nCELL_STYLE = {  # kind -> (background, text)\n    \"wall\": (\"#4b5763\", \"#dfe6e9\"),\n    \"free\": (\"#f1f2f6\", \"#2d3436\"),\n    \"hotspot\": (\"#fdcb6e\", \"#4a3500\"),\n    \"route\": (\"#74b9ff\", \"#0b2545\"),\n    \"route_hot\": (\"#f0932b\", \"#2d1600\"),\n    \"explored\": (\"#b8c7d9\", \"#1e272e\"),\n    \"start\": (\"#00a878\", \"#ffffff\"),\n    \"goal\": (\"#d63031\", \"#ffffff\"),\n}\nACTION_COLORS = {MOVE: \"#1e9e57\", WAIT: \"#d68910\", REROUTE: \"#2471a3\"}\nOUTCOME_TEXT = {\n    \"moved\": \"moved forward\",\n    \"collision\": \"COLLISION (stayed in place)\",\n    \"waited\": \"waited one tick\",\n    \"rerouted\": \"stopped to re-plan and switched to the detour\",\n}\nTARGET_RING = \"#e84118\"\n\n\ndef grid_html(grid, *, route=(), robot=None, target=None, explored=(), start=None,\n              goal=None, blocked_target=False, cell_px=34) -> str:\n    \"\"\"Render the campus map as an HTML table.\"\"\"\n    start, goal = start or grid.start, goal or grid.goal\n    route_set, explored_set = set(route), set(explored)\n    rows = []\n    for r in range(grid.rows):\n        tds = []\n        for c in range(grid.cols):\n            cell = (r, c)\n            label = \"\"\n            if cell in grid.walls:\n                kind = \"wall\"\n            elif cell == start:\n                kind, label = \"start\", \"S\"\n            elif cell == goal:\n                kind, label = \"goal\", \"G\"\n            elif cell in route_set:\n                kind = \"route_hot\" if cell in grid.hotspots else \"route\"\n            elif cell in explored_set:\n                kind = \"explored\"\n            elif cell in grid.hotspots:\n                kind = \"hotspot\"\n            else:\n                kind = \"free\"\n            if not label and cell in grid.hotspots:\n                label = \"o\"\n            if cell == target and blocked_target:\n                label = \"🚧\"\n            if cell == robot:\n                label = \"🤖\"\n            bg, fg = CELL_STYLE[kind]\n            ring = (f\"box-shadow:0 0 0 3px {TARGET_RING} inset;\" if cell == target\n                    else \"box-shadow:0 0 0 1px rgba(0,0,0,0.10) inset;\")\n            tds.append(\n                f'<td style=\"width:{cell_px}px;height:{cell_px}px;min-width:{cell_px}px;'\n                f\"background:{bg};color:{fg};text-align:center;vertical-align:middle;\"\n                f\"font-weight:700;font-size:15px;border-radius:6px;padding:0;border:none;\"\n                f'{ring}\" title=\"{cell}\">{label}<\/td>'\n            )\n        rows.append(\"<tr>\" + \"\".join(tds) + \"<\/tr>\")\n    return (\n        '<div style=\"overflow-x:auto;padding:2px 0 6px 0\">'\n        '<table style=\"border-collapse:separate;border-spacing:3px;margin:0;border:none\">'\n        + \"\".join(rows) + \"<\/table><\/div>\"\n    )\n\n\ndef legend_html(items: list[tuple[str, str]]) -> str:\n    chips = []\n    for kind, text in items:\n        if kind == \"target\":\n            style = f\"background:#f1f2f6;color:#2d3436;box-shadow:0 0 0 3px {TARGET_RING} inset\"\n        else:\n            bg, fg = CELL_STYLE[kind]\n            style = f\"background:{bg};color:{fg}\"\n        chips.append(f'<span style=\"{style};padding:3px 9px;border-radius:6px;'\n                     f'font-size:12px;font-weight:600;white-space:nowrap\">{text}<\/span>')\n    return ('<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px 0\">'\n            + \"\".join(chips) + \"<\/div>\")\n\n\ndef badge(text: str, color: str) -> str:\n    return (f'<span style=\"background:{color};color:#ffffff;padding:6px 16px;'\n            f'border-radius:999px;font-weight:800;font-size:1.1rem;letter-spacing:.03em\">'\n            f\"{text}<\/span>\")\n\n\n# ---------------------------------------------------------------------------\n# Cached computations (arguments are plain values so caching is reliable)\n# ---------------------------------------------------------------------------\n\ndef make_grid(map_name: str, hotspot_risk: float):\n    return dataclasses.replace(load_map(map_name), hotspot_risk=hotspot_risk)\n\n\ndef make_cfg(sens: float, fa: float, collision: float, gamma: float, mixing: float) -> SimConfig:\n    return SimConfig(sensor=SensorModel(sens, fa), costs=Costs(collision=collision),\n                     gamma=gamma, mixing=mixing)\n\n\n@st.cache_data(show_spinner=False)\ndef cached_episode(map_name, hot, policy, seed, sens, fa, collision, gamma, mixing):\n    return run_episode(make_grid(map_name, hot), policy, seed,\n                       make_cfg(sens, fa, collision, gamma, mixing))\n\n\n@st.cache_data(show_spinner=False)\ndef cached_compare(map_name, hot, sens, fa, collision, gamma, mixing, episodes):\n    grid, cfg = make_grid(map_name, hot), make_cfg(sens, fa, collision, gamma, mixing)\n    return [evaluate(grid, p, episodes, cfg) for p in POLICIES]\n\n\n@st.cache_data(show_spinner=False)\ndef cached_sensitivity(map_name, hot, sens, fa, gamma, mixing, episodes, penalties):\n    rows = []\n    for pen in penalties:\n        grid, cfg = make_grid(map_name, hot), make_cfg(sens, fa, pen, gamma, mixing)\n        costs = {p: evaluate(grid, p, episodes, cfg)[\"avg_cost\"] for p in POLICIES}\n        rows.append({\"penalty\": pen, **costs})\n    return rows\n\n\n# ---------------------------------------------------------------------------\n# Sidebar\n# ---------------------------------------------------------------------------\n\nwith st.sidebar:\n    st.header(\"Settings\")\n    map_names = list(MAPS)\n    map_name = st.selectbox(\"Campus map\", map_names,\n                            index=map_names.index(\"Campus 9x12\") if \"Campus 9x12\" in MAPS else 0,\n                            key=\"map\")\n    policies = list(POLICIES)\n    policy = st.selectbox(\"Robot policy\", policies, index=policies.index(\"bayes_mdp\"),\n                          format_func=POLICIES.get, key=\"policy\",\n                          help=\"'Bayes + MDP' is the full system; the others are baselines.\")\n    seed = int(st.number_input(\"Random seed (world)\", min_value=0, max_value=100_000, value=5,\n                               step=1, key=\"seed\",\n                               help=\"Same seed = same hidden obstacles for every policy.\"))\n    with st.expander(\"Sensor model\", expanded=True):\n        sens = st.slider(\"Sensitivity  P(alert | blocked)\", 0.50, 1.00, 0.90, 0.01, key=\"sens\")\n        fa = st.slider(\"False alarm  P(alert | clear)\", 0.00, 0.50, 0.20, 0.01, key=\"fa\")\n        if sens <= fa:\n            st.warning(\"Sensitivity ≤ false-alarm rate: the sensor carries no useful information.\")\n    with st.expander(\"World and rewards\", expanded=True):\n        hot = st.slider(\"Hotspot obstacle risk  P(blocked)\", 0.05, 0.80, 0.30, 0.01, key=\"hot\")\n        collision = float(st.slider(\"Collision penalty\", 0, 200, 50, 5, key=\"collision\"))\n        gamma = st.slider(\"Discount factor γ\", 0.50, 0.99, 0.95, 0.01, key=\"gamma\")\n        mixing = st.slider(\"Obstacle change rate\", 0.10, 1.00, 0.50, 0.05, key=\"mixing\",\n                           help=\"How quickly temporary obstacles appear / disappear per tick.\")\n    with st.expander(\"About\"):\n        st.markdown(\n            \"**Topic 1 – Search:** A* plans the shortest route.  \\n\"\n            \"**Topic 2 – Probabilistic reasoning:** a Bayes filter turns noisy sensor \"\n            \"beeps into P(blocked).  \\n\"\n            \"**Topic 3 – Decision making:** an MDP solved with value iteration picks \"\n            \"Move / Wait / Reroute.\"\n        )\n\ngrid = make_grid(map_name, hot)\ncfg = make_cfg(sens, fa, collision, gamma, mixing)\n\nst.title(\"🤖 Campus Delivery Robot\")\nst.caption(\"A* search + Bayes filter + MDP value iteration\")\nst.markdown(\n    \"A delivery robot carries a package from the **main gate (S)** to the **dormitory (G)**. \"\n    \"It plans its route with **A\\\\***, tracks uncertain obstacles with a **Bayes filter** and \"\n    \"chooses **Move / Wait / Reroute** with an **MDP**.\"\n)\n\ntab_mission, tab_search, tab_bayes, tab_mdp, tab_exp = st.tabs(\n    [\"🚚 Mission\", \"🧭 A* Search\", \"📡 Bayes Filter\", \"🧠 MDP\", \"📊 Experiments\"])\n\n\n# ---------------------------------------------------------------------------\n# Tab 1: Mission\n# ---------------------------------------------------------------------------\n\ndef explain(s, policy_key: str) -> str:\n    if s.target == grid.goal:\n        where = \"the goal\"\n    elif s.target in grid.hotspots:\n        where = \"a hotspot\"\n    else:\n        where = \"an ordinary cell\"\n    obs = f\"The sensor {'beeped' if s.alert else 'stayed quiet'} at {where}\"\n    if abs(s.posterior - s.prior) < 0.005:\n        belief = f\"belief stays at {s.posterior:.2f}\"\n    else:\n        verb = \"rose\" if s.posterior > s.prior else \"fell\"\n        belief = f\"belief {verb} from {s.prior:.2f} to {s.posterior:.2f}\"\n    a = s.action\n    if policy_key == \"naive\":\n        why = \"the A*-only robot ignores the sensor and always moves\"\n    elif policy_key == \"reactive\":\n        why = (\"the reactive robot waits whenever the sensor beeps\" if s.alert\n               else \"no beep, so the reactive robot moves\")\n    elif policy_key == \"bayes\":\n        side = \"above\" if s.posterior > 0.5 else \"below\"\n        why = f\"belief is {side} the 0.5 threshold, so it {'waits' if a == WAIT else 'moves'}\"\n    else:\n        q = s.scores\n        if a == MOVE:\n            why = \"moving has the best expected value because the collision risk is small\"\n        elif a == WAIT:\n            why = (f\"waiting one tick (Q = {q[WAIT]:.2f}) is cheaper than risking a collision \"\n                   f\"(Q(Move) = {q[MOVE]:.2f})\")\n        else:\n            why = (f\"the A* detour costs only +{s.detour_extra} steps, which beats waiting \"\n                   f\"(Q = {q[WAIT]:.2f}) or risking a collision\")\n    sentence = f\"{obs}: {belief}; {why}.\"\n    if s.outcome == \"collision\":\n        sentence += f\" It bumped into an obstacle (penalty −{collision:g}).\"\n    return sentence\n\n\ndef _shift_step(delta: int, n: int) -> None:\n    st.session_state.step = min(max(st.session_state.step + delta, 1), n)\n\n\nwith tab_mission:\n    ep = cached_episode(map_name, hot, policy, seed, sens, fa, collision, gamma, mixing)\n    n = len(ep.log)\n\n    m = st.columns(6)\n    m[0].metric(\"Delivered\", \"Yes ✅\" if ep.delivered else \"No ❌\")\n    m[1].metric(\"Time (ticks)\", ep.ticks)\n    m[2].metric(\"Collisions\", ep.collisions)\n    m[3].metric(\"Waits\", ep.waits)\n    m[4].metric(\"Reroutes\", ep.reroutes)\n    m[5].metric(\"Total cost\", f\"{ep.total_cost:g}\", help=\"ticks + collision penalty × collisions\")\n\n    if n == 0:\n        st.info(\"The robot made no decisions in this episode.\")\n    else:\n        signature = (map_name, hot, policy, seed, sens, fa, collision, gamma, mixing)\n        if st.session_state.get(\"episode_sig\") != signature:\n            st.session_state.episode_sig = signature\n            st.session_state.step = 1\n        st.session_state.step = min(max(int(st.session_state.get(\"step\", 1)), 1), n)\n\n        left, right = st.columns([1.15, 1], gap=\"large\")\n        with left:\n            if n > 1:\n                b1, b2, b3 = st.columns([1, 4, 1], vertical_alignment=\"bottom\")\n                b1.button(\"◀ Prev\", key=\"prev\", on_click=_shift_step, args=(-1, n),\n                          disabled=st.session_state.step <= 1)\n                b2.slider(\"Timeline — decision step\", 1, n, key=\"step\")\n                b3.button(\"Next ▶\", key=\"next\", on_click=_shift_step, args=(1, n),\n                          disabled=st.session_state.step >= n)\n            k = st.session_state.step\n            s = ep.log[k - 1]\n            route_before = ep.log[k - 2].route if k >= 2 else ep.initial_route\n            show_truth = st.toggle(\"Show ground truth (hidden from the robot)\", key=\"truth\")\n            st.markdown(grid_html(grid, route=route_before, robot=s.position, target=s.target,\n                                  blocked_target=show_truth and s.truly_blocked),\n                        unsafe_allow_html=True)\n            st.markdown(legend_html([(\"start\", \"S start\"), (\"goal\", \"G goal\"),\n                                     (\"wall\", \"building\"), (\"hotspot\", \"o hotspot\"),\n                                     (\"route\", \"planned route\"), (\"route_hot\", \"hotspot on route\"),\n                                     (\"target\", \"cell being sensed\")]),\n                        unsafe_allow_html=True)\n\n        with right:\n            with st.container(border=True):\n                kind = (\"hotspot\" if s.target in grid.hotspots else\n                        \"goal\" if s.target == grid.goal else \"ordinary cell\")\n                st.markdown(f\"#### Step {k} of {n} · tick {s.tick}\")\n                st.caption(f\"Robot at {s.position} → next cell {s.target} ({kind})\")\n                c1, c2 = st.columns(2)\n                c1.metric(\"Sensor\", \"🔔 ALERT\" if s.alert else \"🔕 quiet\")\n                c2.metric(\"P(blocked)\", f\"{s.posterior:.2f}\",\n                          delta=f\"{s.posterior - s.prior:+.2f} from prior {s.prior:.2f}\",\n                          delta_color=\"inverse\")\n                st.markdown(\n                    f\"Decision: {badge(s.action.upper(), ACTION_COLORS[s.action])}\"\n                    f\"&nbsp;&nbsp; → {OUTCOME_TEXT[s.outcome]}\", unsafe_allow_html=True)\n                st.write(\"\")\n                if s.scores:\n                    qdf = pd.DataFrame({\"action\": list(s.scores), \"Q\": list(s.scores.values())})\n                    chart = (alt.Chart(qdf).mark_bar(cornerRadius=4).encode(\n                        x=alt.X(\"Q:Q\", title=\"Expected value Q(b, a)  (higher is better)\"),\n                        y=alt.Y(\"action:N\", sort=list(s.scores), title=None),\n                        color=alt.Color(\"action:N\", legend=None, scale=alt.Scale(\n                            domain=list(ACTION_COLORS), range=list(ACTION_COLORS.values()))),\n                        tooltip=[\"action\", alt.Tooltip(\"Q:Q\", format=\".2f\")],\n                    ).properties(height=120))\n                    st.altair_chart(chart, width=\"stretch\")\n                else:\n                    st.caption(\"This baseline does not use the MDP; it follows a fixed rule.\")\n                if s.detour_extra is not None:\n                    st.caption(f\"A* detour around {s.target}: +{s.detour_extra} extra steps.\")\n                else:\n                    st.caption(f\"No A* detour exists around {s.target}.\")\n                if show_truth:\n                    st.markdown(f\"**Ground truth:** the cell was actually \"\n                                f\"**{'BLOCKED 🚧' if s.truly_blocked else 'clear'}**.\")\n                st.info(explain(s, policy))\n\n        with st.expander(\"Full decision log\"):\n            st.dataframe(pd.DataFrame([{\n                \"tick\": x.tick, \"at\": str(x.position), \"next\": str(x.target),\n                \"sensor\": \"ALERT\" if x.alert else \"quiet\", \"prior\": round(x.prior, 3),\n                \"posterior\": round(x.posterior, 3), \"action\": x.action, \"outcome\": x.outcome,\n                \"truth\": \"blocked\" if x.truly_blocked else \"clear\",\n            } for x in ep.log]), hide_index=True)\n\n    other = \"naive\" if policy != \"naive\" else \"bayes_mdp\"\n    if st.checkbox(f\"Compare with “{POLICIES[other]}” on the same world\", key=\"compare_naive\"):\n        ep2 = cached_episode(map_name, hot, other, seed, sens, fa, collision, gamma, mixing)\n        st.dataframe(pd.DataFrame([{\n            \"policy\": POLICIES[e.policy], \"delivered\": e.delivered, \"ticks\": e.ticks,\n            \"collisions\": e.collisions, \"waits\": e.waits, \"reroutes\": e.reroutes,\n            \"total cost\": e.total_cost} for e in (ep, ep2)]), hide_index=True)\n\n\n# ---------------------------------------------------------------------------\n# Tab 2: A* search\n# ---------------------------------------------------------------------------\n\nwith tab_search:\n    st.markdown(\"A* expands the node with the lowest $f(n) = g(n) + h(n)$: cost so far plus \"\n                \"the Manhattan-distance estimate of the cost to go.\")\n    st.latex(r\"f(n) = g(n) + h(n), \\qquad h(n) = |r_n - r_G| + |c_n - c_G|\")\n    free = grid.free_cells()\n\n    def cell_name(c):\n        return f\"{c}  (S)\" if c == grid.start else f\"{c}  (G)\" if c == grid.goal else str(c)\n\n    c1, c2, c3 = st.columns([1, 1, 2])\n    start = c1.selectbox(\"Start\", free, index=free.index(grid.start), format_func=cell_name,\n                         key=f\"search_start_{map_name}\")\n    goal = c2.selectbox(\"Goal\", free, index=free.index(grid.goal), format_func=cell_name,\n                        key=f\"search_goal_{map_name}\")\n    shown = c3.radio(\"Show on map\", list(ALGORITHMS), horizontal=True, key=\"search_alg\")\n\n    results = {name: fn(grid, start, goal) for name, fn in ALGORITHMS.items()}\n    finite = [r.cost for r in results.values() if r.found]\n    best_cost = min(finite) if finite else None\n    left, right = st.columns([1.15, 1], gap=\"large\")\n    with right:\n        st.dataframe(pd.DataFrame([{\n            \"algorithm\": name,\n            \"path length\": int(r.cost) if r.found else None,\n            \"nodes expanded\": r.expanded,\n            \"optimal\": (\"✅\" if r.found and r.cost == best_cost else \"❌\") if r.found else \"—\",\n        } for name, r in results.items()]), hide_index=True)\n        st.caption(\"A* and UCS/BFS all find the shortest path, but A* expands far fewer nodes \"\n                   \"thanks to the heuristic. Greedy ignores g(n), so it is not guaranteed \"\n                   \"to be optimal.\")\n    with left:\n        res = results[shown]\n        if not res.found:\n            st.warning(f\"No path from {start} to {goal}: the goal is unreachable.\")\n        st.markdown(grid_html(grid, route=res.path or [], explored=res.explored, start=start,\n                              goal=goal), unsafe_allow_html=True)\n        st.markdown(legend_html([(\"start\", \"S start\"), (\"goal\", \"G goal\"), (\"wall\", \"building\"),\n                                 (\"explored\", \"expanded node\"), (\"route\", \"path\"),\n                                 (\"hotspot\", \"o hotspot\")]), unsafe_allow_html=True)\n        if res.found:\n            st.caption(f\"{shown}: path of {int(res.cost)} steps, {res.expanded} nodes expanded.\")\n\n\n# ---------------------------------------------------------------------------\n# Tab 3: Bayes filter\n# ---------------------------------------------------------------------------\n\nwith tab_bayes:\n    st.latex(r\"P(B \\mid e) = \\frac{P(e \\mid B)\\,P(B)}{P(e \\mid B)\\,P(B) + \"\n             r\"P(e \\mid \\neg B)\\,(1 - P(B))}\")\n    c1, c2, c3 = st.columns(3)\n    b_prior = c1.slider(\"Prior P(blocked)\", 0.0, 1.0, float(hot), 0.01, key=\"bayes_prior\")\n    b_sens = c2.slider(\"P(alert | blocked)\", 0.0, 1.0, float(sens), 0.01, key=\"bayes_sens\")\n    b_fa = c3.slider(\"P(alert | clear)\", 0.0, 1.0, float(fa), 0.01, key=\"bayes_fa\")\n    c4, c5 = st.columns([2, 1])\n    text = c4.text_input(\"Sensor readings (A = alert / beep, Q = quiet; up to 10)\", \"A A Q\",\n                         key=\"bayes_readings\")\n    use_dyn = c5.toggle(\"Obstacle may change between readings (time update)\",\n                        key=\"bayes_dyn\")\n\n    tokens = [t for t in re.split(r\"[\\s,;]+\", text.strip()) if t]\n    bad = [t for t in tokens if t.upper() not in {\"A\", \"Q\", \"ALERT\", \"QUIET\"}]\n    if not tokens:\n        st.info(\"Enter at least one reading, e.g. `A Q A`.\")\n    elif bad:\n        st.error(f\"Unknown readings: {', '.join(bad)}. Use A (alert) or Q (quiet).\")\n    elif len(tokens) > 10:\n        st.error(\"Please enter at most 10 readings.\")\n    else:\n        readings = [t.upper().startswith(\"A\") for t in tokens]\n        sensor = SensorModel(b_sens, b_fa)\n        dyn = ObstacleDynamics.from_risk(b_prior, mixing)\n        rows, belief, trace = [], b_prior, [{\"step\": 0, \"belief\": b_prior}]\n        try:\n            for i, alert in enumerate(readings, start=1):\n                before = predict(belief, dyn) if (use_dyn and i > 1) else belief\n                l_b, l_c = sensor.likelihood(alert, True), sensor.likelihood(alert, False)\n                evidence = l_b * before + l_c * (1 - before)\n                belief = bayes_update(before, alert, sensor)\n                rows.append({\"#\": i, \"reading\": \"ALERT\" if alert else \"quiet\",\n                             \"prior\": round(before, 4), \"P(e|blocked)\": l_b,\n                             \"P(e|clear)\": l_c, \"P(e)\": round(evidence, 4),\n                             \"posterior\": round(belief, 4)})\n                trace.append({\"step\": i, \"belief\": belief})\n        except ValueError as err:\n            st.error(f\"Impossible observation under this sensor model: {err}\")\n        if rows:\n            left, right = st.columns([1.2, 1], gap=\"large\")\n            left.dataframe(pd.DataFrame(rows), hide_index=True)\n            r0 = rows[0]\n            left.caption(f\"First update: {r0['P(e|blocked)']:.2f} × {r0['prior']:.2f} / \"\n                         f\"{r0['P(e)']:.4f} = {r0['posterior']:.3f}\")\n            chart = (alt.Chart(pd.DataFrame(trace)).mark_line(point=True, color=\"#2471a3\")\n                     .encode(x=alt.X(\"step:O\", title=\"reading #  (0 = prior)\"),\n                             y=alt.Y(\"belief:Q\", title=\"P(blocked)\",\n                                     scale=alt.Scale(domain=[0, 1])),\n                             tooltip=[\"step\", alt.Tooltip(\"belief:Q\", format=\".3f\")])\n                     .properties(height=260))\n            right.altair_chart(chart, width=\"stretch\")\n            if use_dyn:\n                st.caption(f\"Time update between readings: P(B) ← P(B)(1 − {dyn.p_clear:.2f}) \"\n                           f\"+ (1 − P(B))·{dyn.p_block:.2f}\")\n\n\n# ---------------------------------------------------------------------------\n# Tab 4: MDP\n# ---------------------------------------------------------------------------\n\nwith tab_mdp:\n    st.markdown(\n        \"**States:** the robot's belief P(blocked) = 0.00, 0.01, …, 1.00 (plus terminal \"\n        \"*Passed*).  **Actions:** Move, Wait, Reroute.  \\n\"\n        f\"**Rewards:** −1 per tick, −{collision:g} for a collision, −(1 + extra + 1) for a \"\n        \"detour.  **Transitions:** the Bayes filter — after a tick the sensor beeps or not, \"\n        \"which moves the belief.\")\n    st.latex(r\"V(b) \\leftarrow \\max_a \\Big[ R(b,a) + \\gamma \\sum_{b'} P(b' \\mid b, a)\\, V(b') \"\n             r\"\\Big]\")\n    c1, c2, c3 = st.columns(3)\n    cell_kind = c1.radio(\"Cell type\", [\"Hotspot\", \"Ordinary cell\"], horizontal=True,\n                         key=\"mdp_cell\")\n    extra = c2.selectbox(\"A* detour\", [None, 0, 2, 4, 6], index=2, key=\"mdp_extra\",\n                         format_func=lambda e: \"no detour\" if e is None else f\"+{e} steps\")\n    b_now = c3.slider(\"Current belief P(blocked)\", 0.0, 1.0, 0.66, 0.01, key=\"mdp_belief\")\n\n    risk = grid.hotspot_risk if cell_kind == \"Hotspot\" else grid.normal_risk\n    enc = Encounter(ObstacleDynamics.from_risk(risk, mixing), cfg.sensor, cfg.costs, extra, gamma)\n    vi = solve(enc)\n    scores = action_values(b_now, enc)\n    best = max(scores, key=scores.get)\n    threshold = move_threshold(enc)\n\n    m = st.columns(4)\n    m[0].metric(\"Value-iteration sweeps\", vi.iterations)\n    m[1].metric(\"Move is best while P(blocked) <\", f\"{threshold:.3f}\")\n    m[2].metric(f\"Best action at b = {b_now:.2f}\", best)\n    m[3].metric(f\"V(b = {b_now:.2f})\", f\"{scores[best]:.2f}\")\n\n    beliefs = [i / 100 for i in range(101)]\n    curve = pd.DataFrame([{\"belief\": b, \"action\": a, \"Q\": q}\n                          for b in beliefs for a, q in action_values(b, enc).items()])\n    lines = alt.Chart(curve).mark_line(strokeWidth=3).encode(\n        x=alt.X(\"belief:Q\", title=\"belief P(blocked)\"),\n        y=alt.Y(\"Q:Q\", title=\"Q(b, a)\"),\n        color=alt.Color(\"action:N\", scale=alt.Scale(domain=list(ACTION_COLORS),\n                                                    range=list(ACTION_COLORS.values()))),\n        tooltip=[\"action\", alt.Tooltip(\"belief:Q\", format=\".2f\"),\n                 alt.Tooltip(\"Q:Q\", format=\".2f\")])\n    rule = alt.Chart(pd.DataFrame({\"belief\": [b_now]})).mark_rule(\n        strokeDash=[4, 4], color=\"#888888\").encode(x=\"belief:Q\")\n    left, right = st.columns(2, gap=\"large\")\n    with left:\n        st.markdown(\"**Q-values vs belief** (dashed line = current belief)\")\n        st.altair_chart((lines + rule).properties(height=300), width=\"stretch\")\n    with right:\n        st.markdown(\"**Value-iteration convergence**\")\n        deltas = pd.DataFrame({\"sweep\": range(1, len(vi.deltas) + 1), \"max |ΔV|\": vi.deltas})\n        deltas = deltas[deltas[\"max |ΔV|\"] > 0]\n        st.altair_chart(alt.Chart(deltas).mark_line(point=True, color=\"#8e44ad\").encode(\n            x=alt.X(\"sweep:Q\"), y=alt.Y(\"max |ΔV|:Q\", scale=alt.Scale(type=\"log\")),\n            tooltip=[\"sweep\", alt.Tooltip(\"max |ΔV|:Q\", format=\".2e\")]\n        ).properties(height=300), width=\"stretch\")\n\n    # Optimal policy as belief ranges\n    best_by_belief = curve.loc[curve.groupby(\"belief\")[\"Q\"].idxmax()].sort_values(\"belief\")\n    segments, current, lo, prev_b = [], None, 0.0, 0.0\n    for b, a in zip(best_by_belief[\"belief\"], best_by_belief[\"action\"]):\n        if a != current:\n            if current is not None:\n                segments.append((lo, prev_b, current))\n            current, lo = a, b\n        prev_b = b\n    segments.append((lo, 1.0, current))\n    st.markdown(\"**Optimal policy:** \" + \" · \".join(\n        f\"{badge(a, ACTION_COLORS[a])} for b ∈ [{a_lo:.2f}, {a_hi:.2f}]\"\n        for a_lo, a_hi, a in segments), unsafe_allow_html=True)\n\n\n# ---------------------------------------------------------------------------\n# Tab 5: Experiments\n# ---------------------------------------------------------------------------\n\nwith tab_exp:\n    st.markdown(\"Every policy is evaluated on **the same random worlds** (same seeds), so the \"\n                \"comparison is fair. **Cost = delivery time + collision penalty × collisions** \"\n                \"(lower is better).\")\n    episodes = st.slider(\"Episodes per policy\", 50, 1000, 200, 50, key=\"episodes\")\n    params = (map_name, hot, sens, fa, collision, gamma, mixing, episodes)\n\n    if st.button(\"▶ Run policy comparison\", type=\"primary\", key=\"run_compare\"):\n        with st.spinner(f\"Simulating {episodes * len(POLICIES)} deliveries…\"):\n            st.session_state.compare = (params, cached_compare(*params))\n    if \"compare\" in st.session_state:\n        saved_params, rows = st.session_state.compare\n        if saved_params != params:\n            st.caption(\"Settings changed since this run — press the button to refresh.\")\n        df = pd.DataFrame([{\n            \"policy\": POLICIES[r[\"policy\"]],\n            \"avg cost\": round(r[\"avg_cost\"], 2),\n            \"avg ticks\": round(r[\"avg_ticks\"], 2),\n            \"avg collisions\": round(r[\"avg_collisions\"], 3),\n            \"collision-free %\": round(100 * r[\"collision_free_rate\"], 1),\n            \"avg waits\": round(r[\"avg_waits\"], 2),\n            \"avg reroutes\": round(r[\"avg_reroutes\"], 2),\n            \"delivered %\": round(100 * r[\"success_rate\"], 1),\n        } for r in rows])\n        left, right = st.columns([1.3, 1], gap=\"large\")\n        left.dataframe(df, hide_index=True)\n        best_row = df.loc[df[\"avg cost\"].idxmin()]\n        left.success(f\"Lowest cost: **{best_row['policy']}** ({best_row['avg cost']:.2f})\")\n        right.altair_chart(alt.Chart(df).mark_bar(cornerRadius=4).encode(\n            x=alt.X(\"avg cost:Q\", title=\"average cost (lower is better)\"),\n            y=alt.Y(\"policy:N\", sort=None, title=None),\n            color=alt.condition(alt.datum.policy == POLICIES[\"bayes_mdp\"],\n                                alt.value(\"#2471a3\"), alt.value(\"#95a5a6\")),\n            tooltip=[\"policy\", \"avg cost\", \"avg collisions\", \"avg ticks\"],\n        ).properties(height=220), width=\"stretch\")\n\n    st.divider()\n    st.markdown(\"**Sensitivity to the collision penalty** — which policy is best when \"\n                \"collisions are cheap or very expensive?\")\n    penalties = (5, 20, 50, 100)\n    sens_params = (map_name, hot, sens, fa, gamma, mixing, episodes, penalties)\n    if st.button(\"▶ Run penalty sensitivity\", key=\"run_sens\",\n                 help=f\"{len(penalties) * len(POLICIES) * episodes} simulated deliveries\"):\n        with st.spinner(\"Running sensitivity study…\"):\n            st.session_state.sensitivity = (sens_params, cached_sensitivity(*sens_params))\n    if \"sensitivity\" in st.session_state:\n        saved_params, rows = st.session_state.sensitivity\n        if saved_params != sens_params:\n            st.caption(\"Settings changed since this run — press the button to refresh.\")\n        table = pd.DataFrame([{\n            \"collision penalty\": r[\"penalty\"],\n            **{POLICIES[p]: round(r[p], 2) for p in POLICIES},\n            \"best policy\": POLICIES[min(POLICIES, key=lambda p: r[p])],\n        } for r in rows])\n        st.dataframe(table, hide_index=True)\n        long = pd.DataFrame([{\"penalty\": r[\"penalty\"], \"policy\": POLICIES[p], \"avg cost\": r[p]}\n                             for r in rows for p in POLICIES])\n        st.altair_chart(alt.Chart(long).mark_line(point=True).encode(\n            x=alt.X(\"penalty:Q\", title=\"collision penalty\"),\n            y=alt.Y(\"avg cost:Q\", title=\"average cost\"),\n            color=alt.Color(\"policy:N\", title=None),\n            tooltip=[\"policy\", \"penalty\", alt.Tooltip(\"avg cost:Q\", format=\".2f\")],\n        ).properties(height=300), width=\"stretch\")\n", "robot/__init__.py": "\"\"\"Campus Delivery Robot: A* search + Bayes filter + MDP (value iteration).\"\"\"\n\nfrom .bayes import ObstacleDynamics, SensorModel, bayes_update, filter_readings, predict\nfrom .grid import MAPS, Grid, load_map\nfrom .mdp import Costs, Encounter, build_belief_mdp, decide, move_threshold, value_iteration\nfrom .search import ALGORITHMS, astar, bfs, greedy, manhattan, ucs\nfrom .simulation import POLICIES, SimConfig, evaluate, run_episode\n\n__all__ = [\n    \"ALGORITHMS\", \"MAPS\", \"POLICIES\", \"Costs\", \"Grid\", \"ObstacleDynamics\", \"SensorModel\",\n    \"SimConfig\", \"Encounter\", \"astar\", \"bayes_update\", \"bfs\", \"build_belief_mdp\", \"decide\",\n    \"evaluate\", \"filter_readings\", \"greedy\", \"load_map\", \"manhattan\",\n    \"move_threshold\", \"predict\", \"run_episode\", \"ucs\", \"value_iteration\",\n]\n", "robot/bayes.py": "\"\"\"Topic 2 -- Probabilistic reasoning: a Bayes filter for \"is the next cell blocked?\".\n\nHidden state  H = \"the cell ahead is blocked by a temporary obstacle\".\nEvidence      e = the obstacle sensor raises an ALERT (or stays silent).\n\nMeasurement update (Bayes' rule):\n\n    P(H | e) = P(e | H) * P(H) / P(e),\n    P(e)     = P(e | H) * P(H) + P(e | not H) * (1 - P(H))\n\nTime update (obstacles appear / disappear while the robot waits),\na two-state Markov chain:\n\n    P(H at t+1) = P(H at t) * (1 - p_clear) + (1 - P(H at t)) * p_block\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Iterable\n\n\ndef _check_prob(name: str, value: float) -> None:\n    if not 0.0 <= value <= 1.0:\n        raise ValueError(f\"{name} must be in [0, 1], got {value}\")\n\n\n@dataclass(frozen=True)\nclass SensorModel:\n    \"\"\"Noisy obstacle sensor.\"\"\"\n\n    sensitivity: float = 0.90  # P(alert | blocked)  -- true-positive rate\n    false_alarm: float = 0.20  # P(alert | clear)    -- false-positive rate\n\n    def __post_init__(self) -> None:\n        _check_prob(\"sensitivity\", self.sensitivity)\n        _check_prob(\"false_alarm\", self.false_alarm)\n\n    def likelihood(self, alert: bool, blocked: bool) -> float:\n        \"\"\"P(observation | state).\"\"\"\n        p_alert = self.sensitivity if blocked else self.false_alarm\n        return p_alert if alert else 1.0 - p_alert\n\n\n@dataclass(frozen=True)\nclass ObstacleDynamics:\n    \"\"\"How a temporary obstacle changes from one tick to the next.\"\"\"\n\n    p_block: float  # P(clear  -> blocked) per tick\n    p_clear: float  # P(blocked -> clear)  per tick\n\n    def __post_init__(self) -> None:\n        _check_prob(\"p_block\", self.p_block)\n        _check_prob(\"p_clear\", self.p_clear)\n\n    @classmethod\n    def from_risk(cls, risk: float, mixing: float = 0.5) -> \"ObstacleDynamics\":\n        \"\"\"Chain whose long-run P(blocked) equals `risk`.\n\n        `mixing` controls how fast obstacles change (1 = independent every tick).\n        \"\"\"\n        _check_prob(\"risk\", risk)\n        _check_prob(\"mixing\", mixing)\n        return cls(p_block=risk * mixing, p_clear=(1.0 - risk) * mixing)\n\n    @property\n    def stationary(self) -> float:\n        total = self.p_block + self.p_clear\n        return self.p_block / total if total else 0.0\n\n\ndef bayes_update(prior: float, alert: bool, sensor: SensorModel) -> float:\n    \"\"\"Posterior P(blocked | observation) from a prior and one sensor reading.\"\"\"\n    _check_prob(\"prior\", prior)\n    p_e_blocked = sensor.likelihood(alert, blocked=True)\n    p_e_clear = sensor.likelihood(alert, blocked=False)\n    evidence = p_e_blocked * prior + p_e_clear * (1.0 - prior)  # P(e), law of total prob.\n    if evidence == 0.0:\n        raise ValueError(\"this observation is impossible under the sensor model\")\n    return p_e_blocked * prior / evidence\n\n\ndef predict(belief: float, dynamics: ObstacleDynamics) -> float:\n    \"\"\"Time update: belief one tick later, before the next sensor reading.\"\"\"\n    _check_prob(\"belief\", belief)\n    return belief * (1.0 - dynamics.p_clear) + (1.0 - belief) * dynamics.p_block\n\n\ndef filter_readings(prior: float, readings: Iterable[bool], sensor: SensorModel,\n                    dynamics: ObstacleDynamics | None = None) -> list[float]:\n    \"\"\"Run the Bayes filter over a sequence of readings; returns beliefs after each.\n\n    With `dynamics=None` the obstacle is assumed static (pure repeated Bayes).\n    \"\"\"\n    beliefs, belief = [], prior\n    for i, alert in enumerate(readings):\n        if dynamics is not None and i > 0:\n            belief = predict(belief, dynamics)\n        belief = bayes_update(belief, alert, sensor)\n        beliefs.append(belief)\n    return beliefs\n", "robot/grid.py": "\"\"\"Campus map: a 4-connected grid parsed from ASCII art.\n\nLegend\n------\n    S  start (main gate)          #  wall / building (never passable)\n    G  goal (dormitory)           o  hotspot: busy area where temporary\n    .  free path                     obstacles (people, carts) are likely\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Iterator\n\nCell = tuple[int, int]\n\nWALL, FREE, HOTSPOT, START, GOAL = \"#\", \".\", \"o\", \"S\", \"G\"\n_ALLOWED = {WALL, FREE, HOTSPOT, START, GOAL}\n\nMOVES: tuple[Cell, ...] = ((0, 1), (1, 0), (0, -1), (-1, 0))  # right, down, left, up\n\n\n@dataclass(frozen=True)\nclass Grid:\n    \"\"\"Static campus map plus the prior risk of temporary obstacles.\"\"\"\n\n    rows: int\n    cols: int\n    walls: frozenset[Cell]\n    hotspots: frozenset[Cell]\n    start: Cell\n    goal: Cell\n    hotspot_risk: float = 0.30  # P(blocked) for a hotspot cell\n    normal_risk: float = 0.02   # P(blocked) for an ordinary free cell\n\n    @classmethod\n    def from_ascii(cls, text: str, **kwargs: float) -> \"Grid\":\n        \"\"\"Parse a map written with the legend above (spaces are ignored).\"\"\"\n        lines = [line.replace(\" \", \"\") for line in text.strip().splitlines()]\n        lines = [line for line in lines if line]\n        if not lines:\n            raise ValueError(\"map is empty\")\n        width = len(lines[0])\n        if any(len(line) != width for line in lines):\n            raise ValueError(\"map must be rectangular\")\n\n        walls, hotspots, starts, goals = set(), set(), [], []\n        for r, line in enumerate(lines):\n            for c, ch in enumerate(line):\n                if ch not in _ALLOWED:\n                    raise ValueError(f\"unknown map symbol {ch!r} at {(r, c)}\")\n                if ch == WALL:\n                    walls.add((r, c))\n                elif ch == HOTSPOT:\n                    hotspots.add((r, c))\n                elif ch == START:\n                    starts.append((r, c))\n                elif ch == GOAL:\n                    goals.append((r, c))\n        if len(starts) != 1 or len(goals) != 1:\n            raise ValueError(\"map needs exactly one S and one G\")\n        return cls(len(lines), width, frozenset(walls), frozenset(hotspots),\n                   starts[0], goals[0], **kwargs)\n\n    def in_bounds(self, cell: Cell) -> bool:\n        r, c = cell\n        return 0 <= r < self.rows and 0 <= c < self.cols\n\n    def passable(self, cell: Cell, blocked: frozenset[Cell] | set[Cell] = frozenset()) -> bool:\n        return self.in_bounds(cell) and cell not in self.walls and cell not in blocked\n\n    def neighbors(self, cell: Cell,\n                  blocked: frozenset[Cell] | set[Cell] = frozenset()) -> Iterator[Cell]:\n        \"\"\"Up to four passable neighbours (no diagonal moves).\"\"\"\n        r, c = cell\n        for dr, dc in MOVES:\n            nxt = (r + dr, c + dc)\n            if self.passable(nxt, blocked):\n                yield nxt\n\n    def risk(self, cell: Cell) -> float:\n        \"\"\"Prior probability that `cell` is blocked by a temporary obstacle.\"\"\"\n        if cell in (self.start, self.goal) or cell in self.walls:\n            return 0.0\n        return self.hotspot_risk if cell in self.hotspots else self.normal_risk\n\n    def free_cells(self) -> list[Cell]:\n        return [(r, c) for r in range(self.rows) for c in range(self.cols)\n                if (r, c) not in self.walls]\n\n    def render(self, path: list[Cell] | None = None, robot: Cell | None = None) -> str:\n        \"\"\"Plain-text picture of the map (used by the CLI).\"\"\"\n        on_path = set(path or [])\n        out = []\n        for r in range(self.rows):\n            row = []\n            for c in range(self.cols):\n                cell = (r, c)\n                if cell == robot:\n                    ch = \"R\"\n                elif cell in self.walls:\n                    ch = \"#\"\n                elif cell == self.start:\n                    ch = \"S\"\n                elif cell == self.goal:\n                    ch = \"G\"\n                elif cell in on_path:\n                    ch = \"*\"\n                elif cell in self.hotspots:\n                    ch = \"o\"\n                else:\n                    ch = \".\"\n                row.append(ch)\n            out.append(\" \".join(row))\n        return \"\\n\".join(out)\n\n\n# The original 5x5 map from version 1 of the project, plus one hotspot on the route.\nCLASSIC_MAP = \"\"\"\nS . . . .\n. # # . .\n. . . . o\n. . . # .\n. . . . G\n\"\"\"\n\n# A bigger campus: buildings (#), busy hotspots (o) near the cafeteria,\n# library and sports hall, main gate S and dormitory G.\nCAMPUS_MAP = \"\"\"\nS . . . . # . . . . . .\n. # # # . # . # # # # .\n. # # # . . o . . . # .\n. . . o . # . # # . . .\n# # . # . # . # # o # #\n. . . . o . . . . . . .\n. # # # . # # # # . # .\n. # # # . . . o . . # .\n. . . . . # # . # . o G\n\"\"\"\n\nMAPS: dict[str, str] = {\n    \"Campus 9x12\": CAMPUS_MAP,\n    \"Classic 5x5\": CLASSIC_MAP,\n}\n\n\ndef load_map(name: str, **kwargs: float) -> Grid:\n    \"\"\"Load one of the built-in maps by name.\"\"\"\n    if name not in MAPS:\n        raise KeyError(f\"unknown map {name!r}; choose from {list(MAPS)}\")\n    return Grid.from_ascii(MAPS[name], **kwargs)\n\n\ndef random_grid(rows: int, cols: int, wall_prob: float, seed: int,\n                hotspot_prob: float = 0.1) -> Grid:\n    \"\"\"Random map with S in the top-left and G in the bottom-right corner.\n\n    The goal may be unreachable -- callers that need a path should check.\n    Used by tests and experiments.\n    \"\"\"\n    import random\n\n    rng = random.Random(seed)\n    start, goal = (0, 0), (rows - 1, cols - 1)\n    walls, hotspots = set(), set()\n    for r in range(rows):\n        for c in range(cols):\n            if (r, c) in (start, goal):\n                continue\n            x = rng.random()\n            if x < wall_prob:\n                walls.add((r, c))\n            elif x < wall_prob + hotspot_prob:\n                hotspots.add((r, c))\n    return Grid(rows, cols, frozenset(walls), frozenset(hotspots), start, goal)\n", "robot/mdp.py": "\"\"\"Topic 3 -- Sequential decision making: an MDP solved with value iteration.\n\nWhen the robot stands in front of a cell that may be blocked it can\n\n    Move     -- step forward (if the cell is actually blocked: collision),\n    Wait     -- stay one tick, then read the sensor again,\n    Reroute  -- stop, re-plan with A* and take the detour (extra steps).\n\nThe robot never sees the true state, only its Bayes belief b = P(blocked).\nSo the MDP is built over belief states (a \"belief MDP\"):\n\n    S      = {b = 0.00, 0.01, ..., 1.00} + terminal \"Passed\"\n    A      = {Move, Wait, Reroute}\n    P      = Bayes filter: after one tick the obstacle may change (time update)\n             and the sensor beeps or stays silent (measurement update),\n             which moves the belief to a new value\n    R      = -1 per tick, -collision penalty if we bump into an obstacle,\n             -(1 + extra + replan) for the detour\n    gamma  = 0.95\n\nValue iteration repeats the Bellman optimality update until it converges:\n\n    V(s) <- max_a [ R(s,a) + gamma * sum_s' P(s'|s,a) * V(s') ]\n\nBeliefs that fall between grid points are split between the two nearest\npoints (linear interpolation), so the belief MDP is an ordinary finite MDP.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom functools import lru_cache\nfrom math import floor\nfrom typing import Hashable\n\nfrom .bayes import ObstacleDynamics, SensorModel, bayes_update, predict\n\nPASSED = \"Passed\"\nMOVE, WAIT, REROUTE = \"Move\", \"Wait\", \"Reroute\"\n\nState = Hashable\nAction = str\nOutcomes = list[tuple[float, State]]\n\n\n# ---------------------------------------------------------------------------\n# Generic finite MDP + value iteration\n# ---------------------------------------------------------------------------\n\n@dataclass\nclass MDP:\n    \"\"\"A finite MDP. Terminal states have value 0 and no actions.\"\"\"\n\n    states: list[State]\n    actions: dict[State, list[Action]]\n    transitions: dict[tuple[State, Action], Outcomes]\n    rewards: dict[tuple[State, Action], float]\n    terminals: frozenset[State]\n    gamma: float = 0.95\n\n    def __post_init__(self) -> None:\n        if not 0.0 <= self.gamma < 1.0:\n            raise ValueError(\"gamma must be in [0, 1) so value iteration converges\")\n        for key, outcomes in self.transitions.items():\n            total = sum(p for p, _ in outcomes)\n            if abs(total - 1.0) > 1e-9:\n                raise ValueError(f\"transition probabilities for {key} sum to {total}\")\n\n\n@dataclass\nclass VIResult:\n    values: dict[State, float]\n    q: dict[State, dict[Action, float]]\n    policy: dict[State, Action]\n    iterations: int\n    deltas: list[float] = field(default_factory=list)  # max |V change| per sweep\n\n\ndef q_value(mdp: MDP, values: dict[State, float], s: State, a: Action) -> float:\n    \"\"\"One-step look-ahead: R(s,a) + gamma * E[V(s')].\"\"\"\n    future = sum(p * values[s2] for p, s2 in mdp.transitions[(s, a)])\n    return mdp.rewards[(s, a)] + mdp.gamma * future\n\n\ndef value_iteration(mdp: MDP, tol: float = 1e-6, max_iter: int = 10_000) -> VIResult:\n    \"\"\"Solve the MDP with synchronous Bellman optimality updates.\"\"\"\n    values = {s: 0.0 for s in mdp.states}\n    deltas: list[float] = []\n    iterations = 0\n    for iterations in range(1, max_iter + 1):\n        new_values = {\n            s: 0.0 if s in mdp.terminals\n            else max(q_value(mdp, values, s, a) for a in mdp.actions[s])\n            for s in mdp.states\n        }\n        delta = max(abs(new_values[s] - values[s]) for s in mdp.states)\n        values = new_values\n        deltas.append(delta)\n        if delta < tol:\n            break\n    q = {s: {a: q_value(mdp, values, s, a) for a in mdp.actions[s]}\n         for s in mdp.states if s not in mdp.terminals}\n    policy = {s: max(qs, key=qs.get) for s, qs in q.items()}\n    return VIResult(values, q, policy, iterations, deltas)\n\n\n# ---------------------------------------------------------------------------\n# The robot's decision problem: Move / Wait / Reroute in front of a cell\n# ---------------------------------------------------------------------------\n\n@dataclass(frozen=True)\nclass Costs:\n    \"\"\"Reward model, written as costs (rewards are the negatives).\"\"\"\n\n    step: float = 1.0        # every tick (moving or waiting) costs time\n    collision: float = 50.0  # extra penalty for bumping into an obstacle (or a person)\n    replan: float = 1.0      # one tick spent stopping and re-planning a detour\n\n\n@dataclass(frozen=True)\nclass Encounter:\n    \"\"\"Everything the MDP needs to know about one suspicious cell.\"\"\"\n\n    dynamics: ObstacleDynamics\n    sensor: SensorModel = SensorModel()\n    costs: Costs = Costs()\n    detour_extra: int | None = None   # extra steps of the A* detour; None = no detour\n    gamma: float = 0.95\n    resolution: int = 100             # belief grid: 0.00, 0.01, ..., 1.00\n\n    @property\n    def actions(self) -> list[Action]:\n        return [MOVE, WAIT] + ([REROUTE] if self.detour_extra is not None else [])\n\n\ndef _spread(belief: float, n: int) -> Outcomes:\n    \"\"\"Split a belief between its two nearest grid points (linear interpolation).\"\"\"\n    x = min(max(belief, 0.0), 1.0) * n\n    lo = min(floor(x), n)\n    w_hi = x - lo\n    if w_hi < 1e-12:\n        return [(1.0, lo)]\n    return [(1.0 - w_hi, lo), (w_hi, lo + 1)]\n\n\ndef _merge(outcomes: Outcomes) -> Outcomes:\n    merged: dict[State, float] = {}\n    for p, s in outcomes:\n        if p > 0.0:\n            merged[s] = merged.get(s, 0.0) + p\n    return [(p, s) for s, p in merged.items()]\n\n\ndef _next_beliefs(belief: float, enc: Encounter) -> Outcomes:\n    \"\"\"Belief one tick later, after the next sensor reading (Bayes filter step).\"\"\"\n    prior = predict(belief, enc.dynamics)                       # time update\n    out: Outcomes = []\n    for alert in (True, False):\n        p_obs = (enc.sensor.likelihood(alert, True) * prior\n                 + enc.sensor.likelihood(alert, False) * (1.0 - prior))\n        if p_obs > 0.0:\n            posterior = bayes_update(prior, alert, enc.sensor)  # measurement update\n            out += [(p_obs * w, s) for w, s in _spread(posterior, enc.resolution)]\n    return _merge(out)\n\n\ndef _model(belief: float, action: Action, enc: Encounter) -> tuple[float, Outcomes]:\n    \"\"\"Expected reward R(b, a) and transition list P(. | b, a).\"\"\"\n    c = enc.costs\n    if action == MOVE:\n        # Clear with prob 1-b: we pass. Blocked with prob b: we bump and stay,\n        # and now know the cell was blocked (belief 1 before the next tick).\n        reward = -(c.step + belief * c.collision)\n        after_bump = [(belief * p, s) for p, s in _next_beliefs(1.0, enc)]\n        return reward, _merge([(1.0 - belief, PASSED)] + after_bump)\n    if action == WAIT:\n        return -c.step, _next_beliefs(belief, enc)\n    if action == REROUTE and enc.detour_extra is not None:\n        return -(c.step * (1 + enc.detour_extra) + c.replan), [(1.0, PASSED)]\n    raise ValueError(f\"action {action!r} is not available\")\n\n\ndef build_belief_mdp(enc: Encounter) -> MDP:\n    \"\"\"Finite MDP over the belief grid; transitions come from the Bayes filter.\"\"\"\n    n = enc.resolution\n    grid_states = list(range(n + 1))      # state i means belief i / n\n    transitions, rewards = {}, {}\n    for i in grid_states:\n        for a in enc.actions:\n            rewards[(i, a)], transitions[(i, a)] = _model(i / n, a, enc)\n    return MDP(\n        states=grid_states + [PASSED],\n        actions={i: enc.actions for i in grid_states},\n        transitions=transitions,\n        rewards=rewards,\n        terminals=frozenset({PASSED}),\n        gamma=enc.gamma,\n    )\n\n\n@lru_cache(maxsize=256)\ndef solve(enc: Encounter) -> VIResult:\n    \"\"\"Value iteration on the belief MDP (cached: each encounter type is solved once).\"\"\"\n    return value_iteration(build_belief_mdp(enc))\n\n\ndef action_values(belief: float, enc: Encounter) -> dict[Action, float]:\n    \"\"\"Q(b, a) for any belief b, using the converged value function.\"\"\"\n    values = solve(enc).values\n    scores = {}\n    for a in enc.actions:\n        reward, outcomes = _model(belief, a, enc)\n        scores[a] = reward + enc.gamma * sum(p * values[s] for p, s in outcomes)\n    return scores\n\n\ndef decide(belief: float, enc: Encounter) -> tuple[Action, dict[Action, float]]:\n    \"\"\"Best action for the current belief. Ties go to Move, then Wait.\"\"\"\n    scores = action_values(belief, enc)\n    return max(scores, key=scores.get), scores\n\n\ndef move_threshold(enc: Encounter, steps: int = 1000) -> float:\n    \"\"\"Smallest belief at which the optimal action is no longer Move.\"\"\"\n    for k in range(steps + 1):\n        if decide(k / steps, enc)[0] != MOVE:\n            return k / steps\n    return 1.0\n", "robot/search.py": "\"\"\"Topic 1 -- Search: A* route planning (with BFS, UCS and Greedy for comparison).\n\nA* expands the frontier node with the lowest\n\n    f(n) = g(n) + h(n)\n\nwhere g(n) is the cost already paid from the start and h(n) is a heuristic\nestimate of the remaining cost. With the Manhattan distance on a\n4-connected grid with unit step costs, h never overestimates (admissible)\nand h(n) <= 1 + h(n') for neighbours (consistent), so A* returns an\noptimal path and never needs to re-open a closed node.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport itertools\nfrom collections import deque\nfrom dataclasses import dataclass, field\nfrom heapq import heappop, heappush\nfrom math import inf\nfrom typing import Callable\n\nfrom .grid import Cell, Grid\n\nBlocked = frozenset[Cell] | set[Cell]\n\n\n@dataclass\nclass SearchResult:\n    algorithm: str\n    path: list[Cell] | None          # start ... goal, or None if unreachable\n    cost: float                      # number of steps (inf if unreachable)\n    expanded: int                    # nodes taken off the frontier and expanded\n    explored: list[Cell] = field(default_factory=list)  # expansion order (for the UI)\n\n    @property\n    def found(self) -> bool:\n        return self.path is not None\n\n\ndef manhattan(a: Cell, b: Cell) -> int:\n    \"\"\"|dr| + |dc| -- admissible and consistent for 4-connected unit-cost moves.\"\"\"\n    return abs(a[0] - b[0]) + abs(a[1] - b[1])\n\n\ndef _reconstruct(came_from: dict[Cell, Cell | None], goal: Cell) -> list[Cell]:\n    path, node = [], goal\n    while node is not None:\n        path.append(node)\n        node = came_from[node]\n    return path[::-1]\n\n\ndef _best_first(name: str, grid: Grid, start: Cell, goal: Cell, blocked: Blocked,\n                priority: Callable[[int, int], int]) -> SearchResult:\n    \"\"\"Generic best-first graph search; `priority(g, h)` decides the strategy.\"\"\"\n    if not grid.passable(start, blocked) or not grid.passable(goal, blocked):\n        return SearchResult(name, None, inf, 0)\n    tie = itertools.count()  # FIFO tie-break so heap never compares cells\n    h0 = manhattan(start, goal)\n    frontier = [(priority(0, h0), h0, next(tie), 0, start)]\n    came_from: dict[Cell, Cell | None] = {start: None}\n    best_g = {start: 0}\n    closed: set[Cell] = set()\n    explored: list[Cell] = []\n\n    while frontier:\n        _, _, _, g, node = heappop(frontier)\n        if node in closed:\n            continue  # stale entry: a cheaper copy was already expanded\n        closed.add(node)\n        explored.append(node)\n        if node == goal:\n            return SearchResult(name, _reconstruct(came_from, goal), g, len(explored), explored)\n        for nxt in grid.neighbors(node, blocked):\n            ng = g + 1\n            if nxt not in closed and ng < best_g.get(nxt, inf):\n                best_g[nxt] = ng\n                came_from[nxt] = node\n                h = manhattan(nxt, goal)\n                heappush(frontier, (priority(ng, h), h, next(tie), ng, nxt))\n    return SearchResult(name, None, inf, len(explored), explored)\n\n\ndef astar(grid: Grid, start: Cell | None = None, goal: Cell | None = None,\n          blocked: Blocked = frozenset()) -> SearchResult:\n    \"\"\"A*: f = g + h. Optimal with an admissible heuristic.\"\"\"\n    return _best_first(\"A*\", grid, start or grid.start, goal or grid.goal, blocked,\n                       lambda g, h: g + h)\n\n\ndef ucs(grid: Grid, start: Cell | None = None, goal: Cell | None = None,\n        blocked: Blocked = frozenset()) -> SearchResult:\n    \"\"\"Uniform-cost search (Dijkstra): f = g. Optimal but uninformed.\"\"\"\n    return _best_first(\"UCS (Dijkstra)\", grid, start or grid.start, goal or grid.goal,\n                       blocked, lambda g, h: g)\n\n\ndef greedy(grid: Grid, start: Cell | None = None, goal: Cell | None = None,\n           blocked: Blocked = frozenset()) -> SearchResult:\n    \"\"\"Greedy best-first: f = h. Fast but NOT guaranteed optimal.\"\"\"\n    return _best_first(\"Greedy\", grid, start or grid.start, goal or grid.goal, blocked,\n                       lambda g, h: h)\n\n\ndef bfs(grid: Grid, start: Cell | None = None, goal: Cell | None = None,\n        blocked: Blocked = frozenset()) -> SearchResult:\n    \"\"\"Breadth-first search: optimal for unit step costs, explores in rings.\"\"\"\n    start, goal = start or grid.start, goal or grid.goal\n    if not grid.passable(start, blocked) or not grid.passable(goal, blocked):\n        return SearchResult(\"BFS\", None, inf, 0)\n    came_from: dict[Cell, Cell | None] = {start: None}\n    queue, explored = deque([start]), []\n    while queue:\n        node = queue.popleft()\n        explored.append(node)\n        if node == goal:\n            path = _reconstruct(came_from, goal)\n            return SearchResult(\"BFS\", path, len(path) - 1, len(explored), explored)\n        for nxt in grid.neighbors(node, blocked):\n            if nxt not in came_from:\n                came_from[nxt] = node\n                queue.append(nxt)\n    return SearchResult(\"BFS\", None, inf, len(explored), explored)\n\n\nALGORITHMS: dict[str, Callable[..., SearchResult]] = {\n    \"A*\": astar,\n    \"UCS (Dijkstra)\": ucs,\n    \"BFS\": bfs,\n    \"Greedy\": greedy,\n}\n", "robot/simulation.py": "\"\"\"Putting it together: A* plans, the Bayes filter tracks, the MDP decides.\n\nEach tick the robot\n  1. looks at the next cell of its A* route and reads the noisy sensor,\n  2. updates P(blocked) for that cell with Bayes' rule,\n  3. asks A* how long a detour around the cell would be,\n  4. picks Move / Wait / Reroute with the policy under test,\n  5. acts in a hidden \"true\" world where obstacles appear and disappear.\n\nFour policies are compared (an ablation study):\n  naive      -- A* only, ignores the sensor and always moves\n  reactive   -- trusts the raw sensor: alert -> Wait, otherwise Move\n  bayes      -- Bayes belief + fixed rule: Wait if P(blocked) > 0.5\n  bayes_mdp  -- full system: Bayes belief + belief-MDP (value iteration)\n\"\"\"\n\nfrom __future__ import annotations\n\nimport random\nfrom dataclasses import dataclass, field\n\nfrom .bayes import ObstacleDynamics, SensorModel, bayes_update, predict\nfrom .grid import Cell, Grid\nfrom .mdp import MOVE, REROUTE, WAIT, Costs, Encounter, decide\nfrom .search import astar\n\nPOLICIES = {\n    \"naive\": \"A* only (ignore sensor)\",\n    \"reactive\": \"Raw sensor (wait on alert)\",\n    \"bayes\": \"Bayes + 0.5 threshold\",\n    \"bayes_mdp\": \"Bayes + MDP (full system)\",\n}\n\n\n@dataclass(frozen=True)\nclass SimConfig:\n    sensor: SensorModel = SensorModel()\n    costs: Costs = Costs()\n    gamma: float = 0.95\n    mixing: float = 0.5          # how quickly obstacles change between ticks\n    max_ticks: int = 200\n\n\n@dataclass\nclass StepLog:\n    tick: int\n    position: Cell\n    target: Cell                 # next cell on the route that was sensed\n    truly_blocked: bool          # hidden ground truth (robot does not see it)\n    alert: bool\n    prior: float\n    posterior: float\n    detour_extra: int | None\n    scores: dict[str, float]\n    action: str\n    outcome: str                 # moved | collision | waited | rerouted\n    route: list[Cell]            # remaining planned route after acting\n\n\n@dataclass\nclass EpisodeResult:\n    policy: str\n    delivered: bool\n    ticks: int\n    collisions: int\n    waits: int\n    reroutes: int\n    total_cost: float            # ticks + collision penalty * collisions\n    initial_route: list[Cell]\n    log: list[StepLog] = field(default_factory=list)\n\n\nclass World:\n    \"\"\"Hidden ground truth: which cells are blocked right now.\"\"\"\n\n    def __init__(self, grid: Grid, rng: random.Random, mixing: float) -> None:\n        self.rng = rng\n        self.dynamics = {c: ObstacleDynamics.from_risk(grid.risk(c), mixing)\n                         for c in grid.free_cells()}\n        self.blocked = {c: rng.random() < grid.risk(c) for c in grid.free_cells()}\n\n    def tick(self) -> None:\n        for cell, dyn in self.dynamics.items():\n            p_change = dyn.p_clear if self.blocked[cell] else dyn.p_block\n            if self.rng.random() < p_change:\n                self.blocked[cell] = not self.blocked[cell]\n\n\ndef _choose(policy: str, alert: bool, belief: float, dynamics: ObstacleDynamics,\n            detour_extra: int | None, cfg: SimConfig) -> tuple[str, dict[str, float]]:\n    if policy == \"naive\":\n        return MOVE, {}\n    if policy == \"reactive\":\n        return (WAIT if alert else MOVE), {}\n    if policy == \"bayes\":\n        return (WAIT if belief > 0.5 else MOVE), {}\n    if policy == \"bayes_mdp\":\n        return decide(belief, Encounter(dynamics, cfg.sensor, cfg.costs, detour_extra,\n                                        cfg.gamma))\n    raise ValueError(f\"unknown policy {policy!r}; choose from {list(POLICIES)}\")\n\n\ndef run_episode(grid: Grid, policy: str = \"bayes_mdp\", seed: int = 0,\n                cfg: SimConfig = SimConfig()) -> EpisodeResult:\n    \"\"\"Simulate one delivery. Same seed => same world, so policies are comparable.\"\"\"\n    world = World(grid, random.Random(seed), cfg.mixing)\n    sensor_rng = random.Random(seed + 1_000_003)  # separate stream for sensor noise\n\n    plan = astar(grid)\n    if not plan.found:\n        raise ValueError(\"goal is unreachable on this map\")\n    route: list[Cell] = plan.path\n    pos = grid.start\n    beliefs: dict[Cell, float] = {}   # tracked beliefs for cells we have sensed\n    avoid: set[Cell] = set()          # cells we decided to route around\n    log: list[StepLog] = []\n    ticks = collisions = waits = reroutes = 0\n\n    while pos != grid.goal and ticks < cfg.max_ticks:\n        target = route[1]\n        dyn = world.dynamics[target]\n\n        # 1-2. Sense the next cell and update the belief with Bayes' rule.\n        truth = world.blocked[target]\n        p_alert = cfg.sensor.sensitivity if truth else cfg.sensor.false_alarm\n        alert = sensor_rng.random() < p_alert\n        prior = beliefs.get(target, grid.risk(target))\n        posterior = bayes_update(prior, alert, cfg.sensor)\n        beliefs[target] = posterior\n\n        # 3. How much longer is the A* detour that avoids this cell?\n        detour = astar(grid, pos, grid.goal, blocked=avoid | {target})\n        remaining = len(route) - 1\n        extra = int(detour.cost - remaining) if detour.found else None\n\n        # 4. Decide.\n        action, scores = _choose(policy, alert, posterior, dyn, extra, cfg)\n\n        # 5. Act in the true world.\n        here = pos\n        if action == REROUTE:\n            avoid.add(target)\n            route = detour.path\n            reroutes += 1\n            outcome = \"rerouted\"           # stopping to re-plan takes one tick\n        elif action == WAIT:\n            waits += 1\n            outcome = \"waited\"\n        elif truth:                        # MOVE into a blocked cell\n            collisions += 1\n            beliefs[target] = 1.0          # now we know it is blocked\n            outcome = \"collision\"\n        else:                              # MOVE into a clear cell\n            pos = target\n            route = route[1:]\n            outcome = \"moved\"\n\n        log.append(StepLog(ticks, here, target, truth,\n                           alert, prior, posterior, extra, scores, action, outcome,\n                           list(route)))\n\n        # Time passes: the world changes and our beliefs drift (Bayes time update).\n        world.tick()\n        ticks += 1\n        beliefs = {c: predict(b, world.dynamics[c]) for c, b in beliefs.items()}\n\n    total = ticks + cfg.costs.collision * collisions\n    return EpisodeResult(policy, pos == grid.goal, ticks, collisions, waits, reroutes,\n                         total, plan.path, log)\n\n\ndef evaluate(grid: Grid, policy: str, episodes: int = 300, cfg: SimConfig = SimConfig(),\n             seed0: int = 0) -> dict[str, float]:\n    \"\"\"Average metrics of a policy over many seeded episodes.\"\"\"\n    results = [run_episode(grid, policy, seed0 + i, cfg) for i in range(episodes)]\n    n = len(results)\n    return {\n        \"policy\": policy,\n        \"success_rate\": sum(r.delivered for r in results) / n,\n        \"avg_ticks\": sum(r.ticks for r in results) / n,\n        \"avg_collisions\": sum(r.collisions for r in results) / n,\n        \"collision_free_rate\": sum(r.collisions == 0 for r in results) / n,\n        \"avg_waits\": sum(r.waits for r in results) / n,\n        \"avg_reroutes\": sum(r.reroutes for r in results) / n,\n        \"avg_cost\": sum(r.total_cost for r in results) / n,\n    }\n"}</script>
